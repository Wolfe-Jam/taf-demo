name: CI + TAF Receipt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual "Run workflow" button

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      # `shell: bash` turns on pipefail: a failing test fails this step.
      - name: Run tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: taf-test-output
          path: test-output.txt
          overwrite: true

  # One receipt per run on main, red runs included (FAILED), saved to the
  # taf-receipts branch by taf-git's receipt job, the only job that writes.
  receipt:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: Wolfe-Jam/taf-git/.github/workflows/receipt.yml@v3.0.0
    with:
      artifact-name: taf-test-output
      test-output-file: test-output.txt
      test-result: ${{ needs.test.result }}
      commit-message: 'chore(taf): update receipt [skip ci]'
